[package]
name = "studiocraft"
version = "0.1.0"
edition = "2021"
description = "L3 egui desktop host for StudioCraft (calls studiocraft-core in-process)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "studiocraft"
path = "src/main.rs"

[dependencies]
studiocraft-core = { path = "../studiocraft-core" }
serde_json = { workspace = true }
eframe = { workspace = true }

[lints]
workspace = true

